steps:
  - name: "gcr.io/cloud-builders/docker"
    args:
      - "build"
      - "-t"
      - "gcr.io/$PROJECT_ID/prompt-guardian:$SHORT_SHA"
      - "."
  - name: "gcr.io/cloud-builders/docker"
    args:
      - "push"
      - "gcr.io/$PROJECT_ID/prompt-guardian:$SHORT_SHA"
  - name: "gcr.io/google.com/cloudsdktool/cloud-sdk"
    args:
      - "gcloud"
      - "run"
      - "deploy"
      - "prompt-guardian"
      - "--region"
      - "us-central1"
      - "--image"
      - "gcr.io/$PROJECT_ID/prompt-guardian:$SHORT_SHA"
      - "--allow-unauthenticated"
      - "--memory"
      - "1Gi"
      - "--timeout"
      - "540s"
      - "--set-env-vars"
      - >-
        PHOENIX_HOST=https://app.phoenix.arize.com,
        PHOENIX_API_KEY=projects/$PROJECT_ID/secrets/PHOENIX_API_KEY/versions/latest,
        PHOENIX_PROJECT_NAME=projects/$PROJECT_ID/secrets/PHOENIX_PROJECT_NAME/versions/latest,
        GOOGLE_API_KEY=projects/$PROJECT_ID/secrets/GOOGLE_API_KEY/versions/latest,
        GOOGLE_CLOUD_PROJECT=projects/$PROJECT_ID/secrets/GOOGLE_CLOUD_PROJECT/versions/latest,
        GOOGLE_CLOUD_REGION=projects/$PROJECT_ID/secrets/GOOGLE_CLOUD_REGION/versions/latest,
        SLACK_WEBHOOK_URL=projects/$PROJECT_ID/secrets/SLACK_WEBHOOK_URL/versions/latest,
        SLACK_CHANNEL=projects/$PROJECT_ID/secrets/SLACK_CHANNEL/versions/latest,
        REGRESSION_THRESHOLD=projects/$PROJECT_ID/secrets/REGRESSION_THRESHOLD/versions/latest,
        EVAL_JUDGE_MODEL=projects/$PROJECT_ID/secrets/EVAL_JUDGE_MODEL/versions/latest,
        POLL_INTERVAL_SECONDS=projects/$PROJECT_ID/secrets/POLL_INTERVAL_SECONDS/versions/latest,
        ENV=projects/$PROJECT_ID/secrets/ENV/versions/latest
images:
  - "gcr.io/$PROJECT_ID/prompt-guardian:$SHORT_SHA"
